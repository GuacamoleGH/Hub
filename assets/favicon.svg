<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0d1117"/>
  <rect x="1" y="1" width="30" height="30" rx="7" stroke="url(#hubGrad)" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Server / Hub Node Graphic -->
  <rect x="6" y="7" width="20" height="5" rx="1.5" fill="#161b22" stroke="url(#hubGrad)" stroke-width="1.2"/>
  <circle cx="9.5" cy="9.5" r="1" fill="#10b981" filter="url(#glow)"/>
  <circle cx="13" cy="9.5" r="1" fill="#06b6d4"/>
  <line x1="18" y1="9.5" x2="23" y2="9.5" stroke="#30363d" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="6" y="14" width="20" height="5" rx="1.5" fill="#161b22" stroke="url(#hubGrad)" stroke-width="1.2"/>
  <circle cx="9.5" cy="16.5" r="1" fill="#10b981" filter="url(#glow)"/>
  <circle cx="13" cy="16.5" r="1" fill="#06b6d4"/>
  <line x1="18" y1="16.5" x2="23" y2="16.5" stroke="#30363d" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="6" y="21" width="20" height="5" rx="1.5" fill="#161b22" stroke="url(#hubGrad)" stroke-width="1.2"/>
  <circle cx="9.5" cy="23.5" r="1" fill="#10b981" filter="url(#glow)"/>
  <circle cx="13" cy="23.5" r="1" fill="#06b6d4"/>
  <line x1="18" y1="23.5" x2="23" y2="23.5" stroke="#30363d" stroke-width="1.5" stroke-linecap="round"/>
</svg>
